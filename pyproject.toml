[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-prediction-identifiability"
version = "1.0.0"
description = "Experiments for 'An Identifiability Theory of Masked Prediction: Mode Blindness and Mask Schedules'"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "mpmath>=1.3",
    "scikit-learn>=1.3",
    "datasets>=2.14",
    "transformers>=4.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: full run matrix / high-precision legs; deselected by default",
]
addopts = "-m 'not slow'"
