[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-prediction-identifiability"
version = "1.0.0"
description = "Experiments for 'On the Identifiability of Masked Prediction: Mode Blindness and Mask Schedules'"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: full run matrix / high-precision legs; deselected by default",
]
addopts = "-m 'not slow'"
